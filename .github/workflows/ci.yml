# KI Quiz Free Edition — CI
# Unified workflow: test → debug APK → release APK (unsigned, F-Droid signs)
# See: mobile-apps-best-practices/docs/25-twa-pwa.md
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Free Edition)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Set up Gradle cache ENTFERNT (09-08): ~/.gradle = persist. Volume
      # (gha-gradle-home) auf dem Self-hosted-Runner — GitHub-Cache (save
      # ~1m49s + restore) war reiner Overhead. Gradle-File-Locks handeln
      # geteilte Homes sicher.
      - name: Verify gradle wrapper
        run: |
          test -f gradlew || { echo "gradlew not found — run 'gradle wrapper' locally"; exit 1; }
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK (unsigned — F-Droid signs)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ki-kompetenz-free-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ki-kompetenz-free-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
