Name: KI Quiz
Summary: KI-Kompetenz Training (14 Lektionen, 8 Mini-Spiele, KI-Score)
Description: |-
    KI Quiz — Free Edition (Open Source / F-Droid)

    14 interaktive Lektionen zur KI-Kompetenz, 8 Mini-Spiele, KI-Score-Quiz
    und Gamification (XP, Level, Badges, Streaks). Intervall-Wiederholung
    (Spaced Repetition) mit Erinnerungen.

    Funktionen:
    - 14 interaktive Lektionen (Text, Quiz, Klassifikation, Luecken, Risikothermometer)
    - 8 Mini-Spiele (KI oder Mensch, Prompt-Raten, Bias-Detektiv, u.a.)
    - KI-Score-Quiz mit 50 Fragen
    - Intervall-Wiederholung mit Tageserinnerungen
    - Gamification: XP, Level, Badges, Tages-Serie
    - Onboarding-Flow fuer Erstnutzer
    - KiBot 3D-Begleiter (waechst mit dem Level)
    - 3-sprachig (Deutsch, Englisch, System)
    - DSGVO-konform: Kein Tracking, keine Werbung, lokale Datenspeicherung
    - Portraet-Modus, Offline-Modus-Anzeige
    - Crash-Schutz mit lokalem Fehlerprotokoll

    Kostenlose Lektionen 1-8 werden vom Server ki-kompetenz-training.org
    geladen (Login optional). Lektionen 9-14 sind in der Google-Play-Version.

RequiresRoot: 'no'

Builds:
  - versionName: "1.2.0"
    versionCode: 10
    commit: main
    subdir: app
    gradle: yes
    output: build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: HTTP
